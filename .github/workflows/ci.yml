name: CI/CD

# Runs the tests on every push and pull request. On main, if every test passes,
# the frontend is deployed to GitHub Pages. Render watches these checks and only
# redeploys the backend once they have all passed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Also covers the price alert job and the smoke test script. Fails if coverage drops below 95%.
      - name: Run tests with coverage
        run: pytest --cov=app --cov=services --cov=send_price_alerts --cov=../scripts --cov-report=term-missing --cov-fail-under=95

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Warn if the backend URL is missing
        if: vars.API_URL == ''
        run: echo "::warning::The API_URL repository variable isn't set, so the deployed site won't be able to reach the backend."

      - name: Lint, type-check and build
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_ALERT_OWNER_ID: ${{ vars.ALERT_OWNER_ID }}

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    name: Deploy to GitHub Pages
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
