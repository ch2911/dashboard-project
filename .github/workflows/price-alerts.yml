name: Price alerts

# Emails users when a stock they've pinned has moved past their alert threshold today.
# Runs here rather than on Render because Render's free server sleeps when the site is idle.
# Every 30 minutes while the US market is open (13:30-20:00 UTC in summer, 14:30-21:00 in winter).

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-alerts
  cancel-in-progress: false

jobs:
  send-alerts:
    name: Send price alerts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send alerts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/settings/
        run: python send_price_alerts.py
