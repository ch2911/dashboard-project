name: Forecast backtest

# Compares the dashboard's forecast model with alternatives on the last few years of real prices.
# It runs when the backtest script changes, or by hand from the Actions tab. The report appears on
# the run's summary page and can be downloaded from its artifacts.

on:
  push:
    paths:
      - scripts/backtest_forecast.py
      - .github/workflows/forecast-backtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    name: Backtest forecast models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run the backtest
        run: python scripts/backtest_forecast.py --out backtest-report.md

      - name: Show the report on the run's page
        run: cat backtest-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest-report.md
